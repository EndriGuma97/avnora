<svg width="100%" viewBox="-135 -180 270 370" xmlns="http://www.w3.org/2000/svg">
<title>AV Contracts Shield</title>

<!-- SHIELD -->
<path d="M0,-165 L120,-133 L120,30 C120,105 65,155 0,175 C-65,155 -120,105 -120,30 L-120,-133 Z" fill="#c4a882" fill-opacity="0.06" stroke="#c4a882" stroke-width="1.5"/>

<!-- Greek Omega -->
<text x="0" y="-45" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="90" fill="#c4a882" opacity="0.85">Ω</text>

<!-- AV -->
<text x="0" y="5" text-anchor="middle" font-family="'Georgia', serif" font-size="38" letter-spacing="10" fill="#c4a882">AV</text>

<!-- Divider -->
<line x1="-60" y1="18" x2="60" y2="18" stroke="#c4a882" stroke-width="0.5" opacity="0.2"/>

<!-- CONTRACT -->
<g transform="translate(0, 32)">
<rect x="-35" y="0" width="70" height="80" rx="2" fill="#c8c8c8" opacity="0.05" stroke="#c4a882" stroke-width="0.8"/>
<rect x="-25" y="6" width="50" height="1.5" rx="0.5" fill="#c4a882" opacity="0.25"/>
<line x1="-25" y1="15" x2="25" y2="15" stroke="#c4a882" stroke-width="0.5" opacity="0.2"/>
<line x1="-25" y1="20" x2="25" y2="20" stroke="#c4a882" stroke-width="0.5" opacity="0.2"/>
<line x1="-25" y1="25" x2="25" y2="25" stroke="#c4a882" stroke-width="0.5" opacity="0.2"/>
<line x1="-25" y1="30" x2="14" y2="30" stroke="#c4a882" stroke-width="0.5" opacity="0.2"/>
<line x1="-25" y1="35" x2="25" y2="35" stroke="#c4a882" stroke-width="0.5" opacity="0.2"/>
<line x1="-25" y1="40" x2="20" y2="40" stroke="#c4a882" stroke-width="0.5" opacity="0.2"/>
<line x1="-25" y1="45" x2="25" y2="45" stroke="#c4a882" stroke-width="0.5" opacity="0.2"/>

<line x1="-16" y1="62" x2="18" y2="62" stroke="#c4a882" stroke-width="1" opacity="0.45"/>
<path d="M-12,60 C-8,54 -4,64 1,56 C4,52 8,62 12,56 C14,53 17,59 20,56" fill="none" stroke="#c4a882" stroke-width="1.1" opacity="0.55"/>

<g transform="translate(24, 52) rotate(-38)">
<rect x="-2" y="-20" width="4" height="15" rx="1" fill="#c4a882" opacity="0.6"/>
<polygon points="-2,-5 2,-5 0,2" fill="#c4a882" opacity="0.65"/>
</g>
</g>
</svg>
